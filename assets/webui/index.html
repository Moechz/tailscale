<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tailscale for TOS</title>
<meta http-equiv="refresh" content="1; url=./ui/">
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font: 15px/1.7 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
         background:#f6f7f9; color:#1a1a1a; }
  @media (prefers-color-scheme: dark) { body { background:#141517; color:#e8e8e8; } .card { background:#1d1f22 !important; } }
  .card { background:#fff; border-radius:14px; padding:32px 36px; max-width:560px;
          box-shadow:0 8px 30px rgba(0,0,0,.08); }
  h1 { font-size:20px; margin:0 0 6px; }
  p  { margin:8px 0; opacity:.85; }
  a.btn { display:inline-block; margin-top:14px; padding:9px 18px; border-radius:8px;
          background:#17181A; color:#fff; text-decoration:none; font-weight:600; }
  code { background:rgba(127,127,127,.15); padding:1px 6px; border-radius:5px; }
  ul { padding-left:20px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Tailscale 正在打开…</h1>
    <p>控制台由官方 <code>tailscale web</code> 提供，经 TOS 网页服务反代到 <code>/tailscale/</code>。</p>
    <p id="hint">如果 3 秒内没有自动跳转，请点击下面的按钮。</p>
    <a class="btn" href="./ui/">打开 Tailscale 控制台</a>
    <ul>
      <li>首次使用：在控制台点击登录，浏览器会跳到 Tailscale 授权页，登录后回到本页。</li>
      <li>登录成功后，本机将获得一个固定的 <code>100.x</code> 地址。</li>
      <li>节点状态保存在 <code>/var/lib/tailscale</code>，升级/重装不会丢失。</li>
    </ul>
  </div>
  <script>
    // 优先按相对路径跳转，避免 nginx 剥前缀后绝对路径落到站点根
    var base = location.pathname.replace(/[^/]*$/, '');
    location.replace(base + 'ui/');
  </script>
</body>
</html>
