# Tailscale —— 入口页（静态，来自 webui.bz2）+ 控制台反代（回环 8088）
# 注意：本文件被写入 TOS 的 /etc/nginx/conf.d/（server 上下文），
#       只能出现 location 级指令，不能出现 server{} 包裹（指南坑 5）。

location = /tailscale {
    return 301 /tailscale/;
}

# 入口页：/tailscale/ → /usr/local/tailscale/webui/index.html（postinst 解压 webui.bz2）
# 入口页：用 root + try_files 精确命中单个文件。
# 不要用 `alias <file>` + index：nginx 会把 index.html 再拼一次
#（实测报 ".../index.htmlindex.html is not a directory" → 500）。
location = /tailscale/ {
    root /usr/local/tailscale/webui;
    try_files /index.html =404;
}

# 官方控制台：/tailscale/ui/ → 127.0.0.1:8088/
# 结尾的 / 会剥掉前缀：tailscale web 内部按根路径工作，其前端全部使用相对地址
#（api/...、./assets/...），剥前缀后无需子路径适配。
location /tailscale/ui/ {
    proxy_pass http://127.0.0.1:8088/;
    absolute_redirect off;                 # 301 不丢 :8181 端口（坑 13）
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;      # 必须带端口，否则同源/Origin 校验 403（坑 14/66）
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# 静态资源兜底（入口页若引用外部文件）
location /tailscale/assets/ {
    alias /usr/local/tailscale/webui/assets/;
    expires 7d;
}
